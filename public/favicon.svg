<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Polikids crown">
  <!-- Hand-drawn interpretation of the Polikids crown mark (plan §3, ADR-014). Owner review required. -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />
  <defs>
    <linearGradient id="crown" gradientUnits="userSpaceOnUse" x1="256" y1="130" x2="256" y2="380">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4038B8" />
    </linearGradient>
  </defs>
  <!-- 5-point crown: tall outer legs (x 70 / 442), mids (x 180 / 332), center point, inner valley pair -->
  <path fill="url(#crown)" d="M94 366 L70 172 L126 300 L180 230 L218 300 L256 196 L294 300 L332 230 L386 300 L442 172 L418 366 Z" />
  <!-- Open rings on the two tall tips -->
  <circle cx="70" cy="172" r="34" fill="url(#crown)" />
  <circle cx="70" cy="172" r="15" fill="#FFFFFF" />
  <circle cx="442" cy="172" r="34" fill="url(#crown)" />
  <circle cx="442" cy="172" r="15" fill="#FFFFFF" />
  <!-- Three white-rimmed dots on the middle notches -->
  <circle cx="128" cy="304" r="14" fill="url(#crown)" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="256" cy="304" r="14" fill="url(#crown)" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="384" cy="304" r="14" fill="url(#crown)" stroke="#FFFFFF" stroke-width="5" />
</svg>
